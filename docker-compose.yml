version: '3.8'

services:
  # vLLM service for running Typhoon 2.5 (or other LLMs)
  vllm:
    image: vllm/vllm-openai:latest
    container_name: lightrag-vllm
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./models:/root/.cache/huggingface
    command: >
      --model scb10x/typhoon-v2.5-instruct
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.4
      --max-model-len 32768
      --dtype auto
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BGE embedding service
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    container_name: lightrag-embedding
    ports:
      - "8001:80"
    environment:
      - MODEL_ID=BAAI/bge-m3
      - CUDA_VISIBLE_DEVICES=0
      - MAX_BATCH_TOKENS=16384
    volumes:
      - ./models/embeddings:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BGE reranker service
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    container_name: lightrag-reranker
    ports:
      - "8002:80"
    environment:
      - MODEL_ID=BAAI/bge-reranker-v2-m3
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./models/reranker:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lightrag-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-lightrag}
      - POSTGRES_USER=${POSTGRES_USER:-lightrag}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-CHANGE_ME_BEFORE_PRODUCTION}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lightrag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LightRAG Server
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag-server
    ports:
      - "9621:9621"
    environment:
      # LLM Configuration
      - LLM_MODEL_NAME=scb10x/typhoon-v2.5-instruct
      - LLM_BASE_URL=http://vllm:8000/v1
      - LLM_API_KEY=dummy
      - LLM_MAX_TOKENS=32768
      - LLM_TEMPERATURE=0.7
      
      # Embedding Configuration
      - EMBEDDING_MODEL=BAAI/bge-m3
      - EMBEDDING_BASE_URL=http://embedding:80
      - EMBEDDING_DIM=1024
      
      # Reranker Configuration
      - RERANKER_MODEL=BAAI/bge-reranker-v2-m3
      - RERANKER_BASE_URL=http://reranker:80
      
      # Storage Configuration
      - KV_STORAGE=PGKVStorage
      - VECTOR_STORAGE=PGVectorStorage
      - GRAPH_STORAGE=PGGraphStorage
      - DOC_STATUS_STORAGE=PGDocStatusStorage
      
      # PostgreSQL Configuration
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-lightrag}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-CHANGE_ME_BEFORE_PRODUCTION}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-lightrag}
      
      # LightRAG Configuration
      - WORKING_DIR=/app/lightrag_data
      - WORKSPACE=customer_support
      - CHUNK_TOKEN_SIZE=1200
      - CHUNK_OVERLAP_TOKEN_SIZE=100
      - MAX_ASYNC=4
      - MAX_EMBED_TOKENS=8192
      - TOP_K=60
      - CHUNK_TOP_K=20
      
      # Language Configuration
      - LANGUAGE=Thai and English
      - ENTITY_TYPES=["organization", "person", "product", "service", "location", "event", "issue", "feature"]
    volumes:
      - ./lightrag_data:/app/lightrag_data
      - ./documents:/app/documents
    depends_on:
      postgres:
        condition: service_healthy
      vllm:
        condition: service_healthy
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9621/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
